name: Build Snake Game APK

on:
  push:
    paths:
      - 'SnakeGame/**'
      - '.github/workflows/snake-game-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeGame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SnakeGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-apk
          path: SnakeGame/SnakeGame.apk
